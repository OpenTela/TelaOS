# PR checks: unit tests (TelaCI), the firmware of the boards, and the screens of every app
# in the simulator.
#
# The firmware job builds what goes onto the watches — PlatformIO, the toolchain of the
# board (GCC 8.4 for Arduino-ESP32 2.x) — and writes how much flash and RAM it takes.
#
# The simulator job builds sim/ against the PR base and against the PR, photographs every
# page of every app on both, and posts one comment: what changed, before / after / diff.
# Pictures live in the sim-screens branch (one commit, no history). A merged PR keeps them, so
# its comment still shows what it changed; a PR closed without merging has them removed.
# PRs from forks get the same report in the job summary and the artifact, without pictures.
name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main, future]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  telaci:
    name: TelaCI
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmbedtls-dev
      - name: Libraries (Lua, ckdl)
        run: bash ci/lib/build_libs.sh
      - name: Build (mock)
        run: python3 ci/build.py "$GITHUB_WORKSPACE" --mock
      - name: Tests
        run: python3 ci/test.py "$GITHUB_WORKSPACE"
      - name: Simulator tools tests
        run: python3 -m unittest discover -s sim/tools -p 'test_*.py'

  firmware:
    name: Firmware (${{ matrix.board }})
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # esp8048w550 is left out: its panel code sets num_fbs and bounce_buffer_size_px,
        # which ESP-IDF 4.4 (espressif32@6.12.0) does not have
        board: [esp4848s040, twatch2020]
    steps:
      - uses: actions/checkout@v6
      - name: PlatformIO packages
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: pio-${{ matrix.board }}-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ matrix.board }}-${{ runner.os }}-
      - name: PlatformIO
        run: |
          python3 -m venv ~/pio
          ~/pio/bin/pip install --quiet platformio pillow   # Pillow: the icon scripts of the build
          echo "$HOME/pio/bin" >> "$GITHUB_PATH"
      - name: Build
        shell: bash
        run: pio run -e "${{ matrix.board }}" 2>&1 | tee build.log
      - name: Size in the job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Прошивка: ${{ matrix.board }}"
            echo
            grep -E '^(RAM|Flash):' build.log | sed 's/^/    /' || echo "Не собралась: лог — в шаге Build."
          } >> "$GITHUB_STEP_SUMMARY"

  screens:
    name: Simulator screens
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write        # pictures go to the sim-screens branch
      pull-requests: write   # the comment that shows them
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          path: head
      - name: Checkout base
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build ccache \
            libsdl2-dev libpng-dev libmbedtls-dev
      - name: Compiler cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache-sim-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-sim-${{ runner.os }}-
      # The judges (sim/tools/judge.py, anim_judge.py): one Playwright version, so the same Chromium
      # every run. Without it the report says they were not measured; the screens go on
      - name: Chromium for the judge
        continue-on-error: true
        run: |
          python3 -m venv ~/judge
          ~/judge/bin/pip install --quiet playwright==1.63.0
          ~/judge/bin/python -m playwright install --with-deps chromium

      - name: Build, photograph, compare
        id: screens
        run: |
          url=""
          if [ "$SAME_REPO" = "true" ]; then
            url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/sim-screens/pr-${PR}/${HEAD_SHA}"
          fi
          py=python3
          if [ -x ~/judge/bin/python ]; then py=~/judge/bin/python; fi
          "$py" head/sim/tools/sim_screens.py --head head --base base --out out --pages 300 \
            --image-url "$url" --base-label "${BASE_SHA::7}" --head-label "${HEAD_SHA::7}" \
            || echo "failed=1" >> "$GITHUB_OUTPUT"

      - name: Report in the job summary
        if: always()
        run: cat out/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sim-screens
          path: |
            out/report.md
            out/status.json
            out/judge.json
            out/anim_judge.json
            out/anim-head/
            out/publish/
            out/shots-head/
            out/tests/
            out/*.log
            out/work-head/*.log
          retention-days: 14
          if-no-files-found: ignore

      # Only with the report that links them: a run cancelled halfway (the PR merged under it)
      # must not replace the pictures the comment shows
      - name: Pictures to the sim-screens branch
        if: always() && env.SAME_REPO == 'true' && hashFiles('out/publish/**') != '' && hashFiles('out/report.md') != ''
        env:
          TOKEN: ${{ github.token }}
        run: |
          bash head/sim/tools/publish_screens.sh \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$PR" "$HEAD_SHA" out/publish

      - name: Comment on the PR
        if: always() && env.SAME_REPO == 'true' && hashFiles('out/report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only our own comment: a person quoting the marker must not be overwritten (nor could be)
          marker='<!-- telaos-sim-screens -->'
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
                 --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${marker}\"))) | .id" \
                 | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F body=@out/report.md > /dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F body=@out/report.md > /dev/null
          fi

      - name: Robot tests or build failed
        if: steps.screens.outputs.failed == '1'
        run: |
          echo "::error::The simulator did not build or a robot test failed: see the report and the sim-screens artifact"
          exit 1

  cleanup:
    name: Remove PR screens
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      !github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          sparse-checkout: sim/tools
      - name: Remove pr-${{ github.event.pull_request.number }}/ from sim-screens
        env:
          TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -f sim/tools/publish_screens.sh ]; then
            bash sim/tools/publish_screens.sh \
              "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$PR"
          fi
